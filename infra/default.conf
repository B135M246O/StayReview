server {
    server_tokens off;
    listen 80;
    server_name 127.0.0.1;
    location /static/redoc.yaml {
        root /var/html/;
    }
    location /static/ {
        alias /var/html/admin_static/;
    }
    location /media/ {
        root /var/html/;
    }
    location / {
        proxy_pass http://web:8000;
    }
}
