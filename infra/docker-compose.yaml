services:
  db:
    image: postgres:16-alpine
    env_file: ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$DB_NAME"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_DB: ${DB_NAME:-stayreview}
  web:
    build: ../api_yamdb
    env_file: ../.env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/collected_static
      - media_data:/app/media
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8002:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../api_yamdb/static:/var/html/static:ro
      - static_data:/var/html/admin_static:ro
      - media_data:/var/html/media:ro
    depends_on:
      - web
volumes:
  postgres_data:
  static_data:
  media_data:
