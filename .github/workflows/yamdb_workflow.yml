name: StayReview checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r api_yamdb/requirements.txt
      - run: python -m pytest
      - run: python api_yamdb/manage.py makemigrations --check --dry-run --settings=api_yamdb.settings_test
